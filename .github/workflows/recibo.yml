name: recibo da semana

on:
  schedule:
    - cron: "17 13 * * 0" # domingo, 10:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recibo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli pillow
      - run: python tools/recibo.py
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ vars.LASTFM_USER }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/colagem-musica.svg
          git diff --cached --quiet || git commit -m "recibo da semana"
          git push
